sdlc:
  agents:
    mode: llm
  workflow-locations:
    - classpath:workflows/llm/*.yaml
  default-workflow: sdlc
  llm:
    # live | record | replay. Override with SDLC_LLM_MODE=replay to run without a key.
    mode: ${SDLC_LLM_MODE:live}
    model: ${SDLC_LLM_MODEL:gpt-5.6-luna}
    api-key: ${OPENAI_API_KEY:}
    recordings-dir: ./scenarios/recordings
    max-output-tokens: 32000
    timeout: 5m
